<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản trị website — Thầy Gia Huy</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<style>
  body.admin-page {
    margin: 0;
    min-height: 100vh;
    background: #f3f6fb;
    font-family: 'Be Vietnam Pro', sans-serif;
    color: #12263a;
  }
  .ap-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 22px;
    background: #fff;
    border-bottom: 1px solid #dce5ef;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .ap-top h1 { margin: 0; font-size: 18px; color: #0f2d52; }
  .ap-top small { color: #5c738a; font-size: 12px; }
  .ap-body {
    max-width: 1100px;
    margin: 0 auto;
    padding: 22px 16px 48px;
  }
  /* flatten modal styles into page */
  .admin-page .admin-modal {
    position: static !important;
    inset: auto !important;
    display: block !important;
    background: transparent !important;
    backdrop-filter: none !important;
    padding: 0 !important;
    place-items: stretch !important;
  }
  .admin-page .admin-box {
    width: 100% !important;
    max-width: none !important;
    max-height: none !important;
    margin: 0 !important;
    border-radius: 18px !important;
    box-shadow: 0 10px 36px rgba(18,38,58,.08) !important;
    border: 1px solid #dce5ef !important;
    background: #fff !important;
    padding: 22px !important;
    overflow: visible !important;
  }
  .admin-page .admin-box > .close { display: none !important; }
  .admin-page #adminForm { display: none !important; }
  .admin-page #adminLoader { display: none !important; }
  .admin-page #adminPanel {
    display: block !important;
  }
  .admin-page .admin-panel.hidden,
  .admin-page #adminPanel.hidden {
    display: block !important;
  }
  .t-btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid #c5d4e6; background: #fff; color: #12263a;
    border-radius: 10px; padding: 9px 14px; font: 600 13px/1 'Be Vietnam Pro', sans-serif;
    text-decoration: none; cursor: pointer;
  }
  .t-btn.primary { background: #163a66; border-color: #163a66; color: #fff; }
</style>
</head>
<body class="admin-page">
  <header class="ap-top">
    <div>
      <h1 id="apTitle">Quản trị website</h1>
      <small id="apSub">Upload · Thư viện · Nhạc · Thống kê</small>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="t-btn" href="teacher.html">← Panel tài khoản</a>
      <a class="t-btn" href="index.html">Trang chủ</a>
      <button type="button" class="t-btn" id="apLogout" style="border-color:#f0c4c4;color:#9b2c2c">Đăng xuất</button>
    </div>
  </header>

  <main class="ap-body">
    <div class="admin-modal open" id="adminModal" aria-hidden="false">
      <div class="admin-box">
        <div class="modal-heading">
          <span class="modal-kicker">ADMIN CENTER</span>
          <b>Quản trị website</b>
          <small>Đổi avatar, upload tài nguyên, quản lý danh sách và nhạc.</small>
        </div>
        <form class="admin-form hidden" id="adminForm"></form>
        <div class="admin-loader hidden" id="adminLoader"></div>
        <div id="adminPanel">
          <div class="admin-profile-card">
            <div class="admin-avatar-preview"><img src="assets/images/avatar.gif" alt="Avatar"></div>
            <div>
              <b>Thầy Gia Huy</b>
              <small>Quản lý profile & thư viện</small>
            </div>
            <span class="admin-badge" id="apBadge">ADMIN</span>
          </div>
          <div class="admin-actions">
            <button class="primary-btn" id="changeAvatarBtn">Đổi ảnh đại diện</button>
            <button class="secondary-btn" id="resetAvatarBtn">Khôi phục avatar</button>
            <input id="avatarInput" type="file" accept="image/*" hidden>
          </div>
          <div class="admin-tabs">
            <button class="admin-tab active" data-admin-tab="upload">Upload</button>
            <button class="admin-tab" data-admin-tab="library">Thư viện</button>
            <button class="admin-tab" data-admin-tab="music" id="tabMusic">Nhạc</button>
            <button class="admin-tab" data-admin-tab="stats">Thống kê</button>
          </div>
          <div id="adminWorkspace"></div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>
  <script>
    (function () {
      const session = Auth.requireAuth({ staffOnly: true });
      if (!session) return;
      const isAdmin = session.role === 'admin';
      const isTeacher = session.role === 'teacher';

      document.getElementById('apTitle').textContent = isAdmin ? 'Panel Quản trị viên' : 'Panel Giáo viên — Công cụ';
      document.getElementById('apSub').textContent = isAdmin
        ? 'Đầy đủ: Upload · Thư viện · Nhạc · Thống kê · Avatar'
        : 'Chỉ Upload · Thư viện · Thống kê';
      document.getElementById('apBadge').textContent = isAdmin ? 'ADMIN' : 'GIÁO VIÊN';

      if (!isAdmin) {
        document.getElementById('tabMusic').style.display = 'none';
        document.getElementById('changeAvatarBtn').style.display = 'none';
        document.getElementById('resetAvatarBtn').style.display = 'none';
      }

      localStorage.setItem('giahuy-admin', '1');

      // open requested tab
      const params = new URLSearchParams(location.search);
      const want = params.get('tab') || localStorage.getItem('giahuy-open-admin-tab') || 'upload';
      localStorage.removeItem('giahuy-open-admin-tab');

      function boot() {
        if (typeof renderAdmin === 'function') {
          renderAdmin(want);
          document.querySelectorAll('.admin-tab').forEach(b => {
            b.classList.toggle('active', b.dataset.adminTab === want);
          });
        } else {
          setTimeout(boot, 200);
        }
      }
      setTimeout(boot, 300);

      document.getElementById('apLogout').addEventListener('click', () => Auth.logout());
    })();
  </script>
</body>
</html>
