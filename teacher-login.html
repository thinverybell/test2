<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập giáo viên — Thầy Gia Huy</title>
<meta name="description" content="Đăng nhập giáo viên">
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@coreui/icons/css/free.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-bg-layer" aria-hidden="true"></div>
  <img class="logo-corner" src="assets/logo-giahuy.png" alt="Logo Gia Huy" width="220" height="90">

  <a class="admin-corner" href="admin-login.html" title="Đăng nhập quản trị viên">
    <span class="admin-corner-ico">⚙</span>
  </a>

  <div class="auth-wrap auth-frame auth-frame-teacher">
    <div class="auth-card">
      <div class="auth-tabs" role="tablist">
        <a class="auth-tab" href="login.html" style="text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center">Học sinh</a>
        <button type="button" class="auth-tab active" data-tab="teacher" role="tab" aria-selected="true">Giáo viên</button>
      </div>

      <div class="auth-panels">
        <form class="auth-panel active" id="teacherForm" autocomplete="on">
          <label class="auth-field">
            <span>Tên đăng nhập</span>
            <input type="text" id="teaUser" placeholder="Tên đăng nhập giáo viên" required maxlength="40">
          </label>
          <label class="auth-field">
            <span>Mã mời</span>
            <input type="text" id="teaInvite" placeholder="Mã mời của giáo viên" required maxlength="40">
          </label>
          <button type="submit" class="auth-submit">Đăng nhập</button>
        </form>
      </div>
    </div>
  </div>

  <div class="auth-toast" id="authToast" hidden></div>

  <script src="js/auth.js"></script>
  <script>
    (function(){
      const s = Auth.getSession();
      if (s) {
        if (s.role === 'admin' || s.role === 'teacher') location.replace('teacher.html');
        else location.replace('index.html');
      }
    })();

    document.getElementById('teacherForm').addEventListener('submit', e => {
      e.preventDefault();
      const r = Auth.loginTeacher(
        document.getElementById('teaUser').value,
        document.getElementById('teaInvite').value
      );
      if (!r.ok) return Auth.toast(r.msg, true);
      Auth.toast('Đăng nhập giáo viên thành công');
      setTimeout(() => location.href = 'teacher.html', 400);
    });
  </script>
</body>
</html>
